<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>You were invited to Nerdbase</title><style>body{font:17px/1.6 -apple-system,system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#1b1b1b;text-align:center}h1{font-size:34px;margin:0 0 8px}code{font-size:32px;letter-spacing:6px;background:#ffe9dc;padding:10px 18px;border-radius:14px;display:inline-block;margin:16px 0}.m{color:#6b6b6b}a{color:#fb6415}</style></head><body><h1>You were invited to Nerdbase</h1><p class="m">Study math, physics and English with step-by-step help.</p><div id="c"></div><p id="t" class="m"></p><p class="m">The app is coming to the App Store. Enter this code in Profile, Invite friends, to get extra lessons and a 7-day free trial.</p><script>var m=location.pathname.match(/invite\/([A-Za-z0-9]{7})/);if(m){document.getElementById("c").innerHTML="<code>"+m[1].toUpperCase()+"</code>";document.getElementById("t").textContent="Your friend\u2019s code"}else{document.querySelector("h1").textContent="Nerdbase";}</script></body></html>
